name: Compilar APK de tablet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tablet-app/**"
      - ".github/workflows/build-tablet-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablet-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        working-directory: tablet-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como descarga
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ControlDeProyectos.apk
          gh release delete tablet-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create tablet-latest ControlDeProyectos.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK para tablet" \
            --notes "Última versión del APK de Control de Proyectos para tablet Android. Compilado el $(date -u +'%Y-%m-%d %H:%M UTC')."
